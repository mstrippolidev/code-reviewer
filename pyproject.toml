[project]
name = "code-reviewer"
version = "0.1.0"
description = "Multi-agent for code review to force clean code rules and solid principles based on uncle bob recommendations"
authors = [
    {name = "Miquel Strippoli"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "langchain (>=1.3.13,<2.0.0)",
    "langchain-core (>=1.4.9,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "guardrails-ai (>=0.10.2,<0.11.0)",
    "langchain-openrouter (>=0.2.7,<0.3.0)",
    "llama-index-core (>=0.14.23,<0.15.0)",
    "llama-index-vector-stores-postgres (>=0.8.1,<0.9.0)",
    "llama-index-embeddings-ollama (>=0.9.0,<0.10.0)",
    "tree-sitter-language-pack (>=1.14.3,<2.0.0)",
    "llama-index-retrievers-bm25 (>=0.6.0,<0.7.0)",
    "sentence-transformers (>=6.0.1,<7.0.0)",
    "langchain-text-splitters (>=1.0.0,<2.0.0)",
    "fastapi (>=0.141.1,<0.142.0)",
    "uvicorn[standard] (>=0.52.4,<0.53.0)",
    "sqlalchemy[asyncio] (>=2.0.52,<3.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "psycopg2-binary (>=2.9.12,<3.0.0)",
    "pyjwt (>=2.13.0,<3.0.0)",
    "httpx (>=0.28.1,<0.29.0)",
    "cryptography (>=50.0.1,<51.0.0)",
    "alembic (>=1.19.2,<2.0.0)",
    "greenlet (>=3.5.5,<4.0.0)",
    "h2 (>=4.4.1,<5.0.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not db and not llm'"
markers = [
    "llm: exercises a real local Ollama model, slower and requires Ollama running",
    "db: exercises a real local Postgres instance, requires the code_reviewer database and schema to already exist",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)",
    "pytest-asyncio (>=1.4.0,<2.0.0)",
    "respx (>=0.23.1,<0.24.0)"
]
