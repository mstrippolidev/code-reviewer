[project]
name = "code-reviewer"
version = "0.1.0"
description = "Multi-agent for code review to force clean code rules and solid principles based on uncle bob recommendations"
authors = [
    {name = "Miquel Strippoli"}
]
requires-python = ">=3.10,<4.0"
dependencies = [
    "pydantic (>=2.13.4,<3.0.0)",
    "pydantic-settings (>=2.14.2,<3.0.0)",
    "langchain (>=1.3.13,<2.0.0)",
    "langchain-core (>=1.4.9,<2.0.0)",
    "langchain-ollama (>=1.1.0,<2.0.0)",
    "guardrails-ai (>=0.10.2,<0.11.0)",
    "langchain-openrouter (>=0.2.7,<0.3.0)",
    "llama-index-core (>=0.14.23,<0.15.0)",
    "llama-index-vector-stores-postgres (>=0.8.1,<0.9.0)",
    "llama-index-embeddings-ollama (>=0.9.0,<0.10.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "llm: exercises a real local Ollama model, slower and requires Ollama running",
    "db: exercises a real local Postgres instance, requires the code_reviewer database and schema to already exist",
]

[dependency-groups]
dev = [
    "pytest (>=9.1.1,<10.0.0)",
    "pytest-mock (>=3.15.1,<4.0.0)"
]
