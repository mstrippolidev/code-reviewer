limit_req_zone $binary_remote_addr zone=oauth_register:1m rate=5r/m;
limit_req_zone $binary_remote_addr zone=oauth_general:1m rate=15r/s;
limit_req_zone $binary_remote_addr zone=guest_session:1m rate=5r/m;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive off;

    limit_req_status 429;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location = /api/guest/session {
        limit_req zone=guest_session burst=3 nodelay;
        proxy_pass http://api:8000;
    }

    location = /oauth/register {
        limit_req zone=oauth_register burst=3 nodelay;
        proxy_pass http://api:8000;
    }

    location /oauth/ {
        limit_req zone=oauth_general burst=30 nodelay;
        proxy_pass http://api:8000;
    }

    location /.well-known/ {
        limit_req zone=oauth_general burst=30 nodelay;
        proxy_pass http://api:8000;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
