apiVersion: batch/v1
kind: Job
metadata:
  name: api-exemplar-seed
spec:
  backoffLimit: 2
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: api
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.37
          command:
            - sh
            - -c
            - until nc -z -w2 "$PG_HOST" "$PG_PORT"; do sleep 2; done
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: host }
            - name: PG_PORT
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: port }
      containers:
        - name: seed
          image: <ECR_REGISTRY>/code-reviewer-api:latest
          command: ["python", "-m", "api.exemplars.seed"]
          envFrom:
            - secretRef:
                name: api-secrets
            - configMapRef:
                name: api-config
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: host }
            - name: PG_PORT
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: port }
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: dbname }
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: user }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: password }
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 2Gi
