apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
spec:
  replicas: 1
  selector: # select the container that have the label app: api
    matchLabels:
      app: api
  template: # add the label app: api to the container
    metadata:
      labels:
        app: api
    spec:
      serviceAccountName: api
      containers:
        - name: api
          image: <ECR_REGISTRY>/code-reviewer-api:latest
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: api-secrets
            - configMapRef:
                name: api-config
          env:
            - name: PG_HOST
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: host }
            - name: PG_PORT
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: port }
            - name: PG_DATABASE
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: dbname }
            - name: PG_USER
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: user }
            - name: PG_PASSWORD
              valueFrom:
                secretKeyRef: { name: code-reviewer-postgres-app, key: password }
          readinessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health/
              port: 8000
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 500m
              memory: 1Gi
            limits:
              cpu: "2"
              memory: 3Gi
