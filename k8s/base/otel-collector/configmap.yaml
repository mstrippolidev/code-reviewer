apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          http:
            endpoint: 0.0.0.0:4318

    processors:
      batch:
        send_batch_size: 200
        send_batch_max_size: 1000
        timeout: 10s

    extensions:
      sigv4auth/metrics:
        region: us-east-2
        service: monitoring
      sigv4auth/traces:
        region: us-east-2
        service: xray

    exporters:
      otlphttp/metrics:
        compression: gzip
        metrics_endpoint: https://monitoring.us-east-2.amazonaws.com/v1/metrics
        auth:
          authenticator: sigv4auth/metrics

      otlphttp/traces:
        compression: gzip
        traces_endpoint: https://xray.us-east-2.amazonaws.com/v1/traces
        auth:
          authenticator: sigv4auth/traces

    service:
      extensions: [sigv4auth/metrics, sigv4auth/traces]
      pipelines:
        metrics:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/metrics]
        traces:
          receivers: [otlp]
          processors: [batch]
          exporters: [otlphttp/traces]
