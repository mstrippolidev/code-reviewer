# We register this new kind of object from CPNG operator to k8s, now this
# file will configure the object

apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: code-reviewer-postgres
spec:
  instances: 3
  # the image with the pgvector extension installed
  imageName: <ECR_REGISTRY>/code-reviewer-postgres:16-pgvector
  storage: # FROM EBS
    size: 5Gi
    storageClass: gp3

  bootstrap:
    initdb:
      # we need to enable the pgvector extension
      database: code-reviewer
      owner: code_reviewer_app
      postInitApplicationSQL:
        - "CREATE EXTENSION IF NOT EXISTS vector;"
        # runs as superuser; without AUTHORIZATION the app user could not create tables in it
        - "CREATE SCHEMA IF NOT EXISTS code_reviewer AUTHORIZATION code_reviewer_app;"

  # set the resources for the pods
  resources:
    requests:
      cpu: 1
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  # tell how to create each replica base on the virtual node or servers
  affinity:
    enablePodAntiAffinity: true
    topologyKey: topology.kubernetes.io/zone
    nodeSelector:
      workload: stateful
    tolerations:
      - key: workload
        operator: Equal
        value: stateful
        effect: NoSchedule
